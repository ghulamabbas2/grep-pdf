[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "clerk-backend-api>=6.0.1",
    "fastapi[standard]>=0.141.1",
    "langchain-anthropic>=1.5.3",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.28.0",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0",
    "tiktoken>=0.13.0",
    "voyageai>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE001", "PLR2004"]
# Line length is owned by the formatter; PEP 695 generic rewrites are skipped to
# avoid churning the Pydantic generic envelopes.
ignore = ["E501", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
# Magic values are fine in assertions.
"**/test_*.py" = ["PLR2004"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are called in argument defaults by design.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Query",
    "fastapi.Form",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.Header",
]
